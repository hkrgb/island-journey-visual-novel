<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>離島旅程｜內容管理後台</title><link rel="stylesheet" href="admin.css"></head><body>
<section id="login" class="login"><div><p class="eyebrow">ISLAND JOURNEY · CMS</p><h1>離島旅程<br>內容管理後台</h1><p>只限指定管理員使用 Google 登入。</p><button id="loginBtn">使用 Google 登入</button><a href="../">← 返回遊戲</a><span id="loginMsg"></span></div></section>
<main id="cms" hidden><header><div><small>ISLAND JOURNEY · CMS</small><b>內容管理後台</b></div><nav><span id="userEmail"></span><button id="previewBtn">即時預覽</button><button id="saveBtn">儲存草稿</button><button id="publishBtn" class="primary">發布</button><button id="logoutBtn">登出</button></nav></header>
<div class="workspace"><aside><div class="aside-head"><b>總篇章</b><button id="addBtn" title="在目前章節新增場景">＋</button></div><button id="titleNav" class="title-nav">✦ 開始／結束畫面</button><input id="search" placeholder="搜尋人物或內容"><div id="chapterTree"></div></aside>
<section class="editor"><div class="status"><span id="status">尚未載入</span><span id="count"></span></div>
<form id="settingsForm" hidden><h2>開始與結束畫面</h2><p class="hint">首頁、按鈕、封面及結局畫面的文字和圖片都可以修改。</p><div class="grid">
<label>瀏覽器標題<input id="siteTitle"></label><label>封面背景網址／路徑<input id="coverImage"></label><label>封面標誌網址／路徑<input id="logoImage"></label><label>英文版本文字<input id="edition"></label><label>「開始」按鈕<input id="startLabel"></label><label>「繼續」按鈕<input id="resumeLabel"></label><label>「章節目錄」按鈕<input id="contentsLabel"></label><label>製作人員文字<input id="credit"></label><label>獎項小字<textarea id="award" rows="3"></textarea></label><label>完結標題<input id="endingTitle"></label><label>完結引句<textarea id="endingQuote" rows="3"></textarea></label><label>完結小字<input id="endingNote"></label><label>重新閱讀按鈕<input id="againLabel"></label></div><div class="upload-row"><label>上載封面／標誌圖片<input id="settingUpload" type="file" accept="image/*"></label><select id="settingUploadTarget"><option value="coverImage">設為封面背景</option><option value="logoImage">設為標誌</option></select><button type="button" id="settingUploadBtn">上載並套用</button></div><div class="visual title-visual"><div><small>封面預覽</small><img id="coverPreview"></div><div><small>標誌預覽</small><img id="logoPreview"></div></div></form>
<div id="empty">從左方先選擇一個章節，再選擇章節內的場景</div>
<form id="form" hidden><div class="editor-title"><div><small id="chapterEyebrow"></small><h2 id="sceneHeading"></h2></div></div><div class="grid"><label>章節<select id="chapter"></select></label><label>章節大標題<input id="chapterName"></label><label>章節編號<input id="chapterNo"></label><label>章節間 MP4 網址／路徑<input id="chapterVideo" placeholder="例如 assets/videos/chapter-2.mp4"></label><label>場景背景<select id="bg"></select></label><label>人物名稱<input id="speaker"></label><label>英文名稱<input id="speakerEn"></label><label>地點<input id="place"></label><label>角色立繪<select id="sprite"></select></label><label>位置<select id="side"><option value="">自動</option><option value="left">左</option><option value="right">右</option></select></label><label class="check"><input id="chapterStart" type="checkbox"> 顯示章節過場</label></div><label>對白／旁白<textarea id="text" rows="7"></textarea></label>
<div class="upload-row"><label>上載新立繪／背景<input id="assetUpload" type="file" accept="image/*"></label><input id="assetName" placeholder="素材名稱，例如 hoitoSurprised"><select id="assetType"><option value="sprite">角色立繪</option><option value="bg">場景背景</option></select><button type="button" id="assetUploadBtn">上載並套用</button></div>
<div class="row"><button type="button" id="upBtn">↑ 上移</button><button type="button" id="downBtn">↓ 下移</button><button type="button" id="duplicateBtn">複製</button><button type="button" id="deleteBtn" class="danger">刪除</button></div><div class="visual"><div><small>背景預覽</small><img id="bgPreview"></div><div><small>立繪預覽</small><img id="spritePreview"></div></div></form></section></div></main>
<dialog id="preview"><button id="closePreview">×</button><iframe title="遊戲預覽"></iframe></dialog><script src="../story-full.js"></script><script type="module" src="admin.js"></script></body></html>
