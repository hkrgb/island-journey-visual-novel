<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>離島旅程｜內容管理後台</title><link rel="stylesheet" href="admin.css"></head><body>
<section id="login" class="login"><div><p class="eyebrow">ISLAND JOURNEY · CMS</p><h1>離島旅程<br>內容管理後台</h1><p>只限指定管理員使用 Google 登入。</p><button id="loginBtn">使用 Google 登入</button><a href="../">← 返回遊戲</a><small id="loginMsg"></small></div></section>
<main id="cms" hidden><header><div><small>ISLAND JOURNEY · CMS</small><b>內容管理後台</b></div><nav><span id="userEmail"></span><button id="previewBtn">即時預覽</button><button id="saveBtn">儲存草稿</button><button id="publishBtn" class="primary">發布</button><button id="logoutBtn">登出</button></nav></header><div class="workspace"><aside><div class="aside-head"><b>劇情節點</b><button id="addBtn">＋</button></div><input id="search" placeholder="搜尋人物或內容"><div id="sceneList"></div></aside><section class="editor"><div class="status"><span id="status">尚未載入</span><span id="count"></span></div><div id="empty">從左方選擇一個劇情節點</div><form id="form" hidden><div class="grid"><label>章節<select id="chapter"></select></label><label>場景背景<select id="bg"></select></label><label>人物名稱<input id="speaker"></label><label>英文名稱<input id="speakerEn"></label><label>地點<input id="place"></label><label>角色立繪<select id="sprite"></select></label><label>位置<select id="side"><option value="">自動</option><option value="left">左</option><option value="right">右</option></select></label><label class="check"><input id="chapterStart" type="checkbox"> 顯示章節過場</label></div><label>對白／旁白<textarea id="text" rows="7"></textarea></label><div class="row"><button type="button" id="upBtn">↑ 上移</button><button type="button" id="downBtn">↓ 下移</button><button type="button" id="duplicateBtn">複製</button><button type="button" id="deleteBtn" class="danger">刪除</button></div><div class="visual"><div><small>背景預覽</small><img id="bgPreview"></div><div><small>立繪預覽</small><img id="spritePreview"></div></div></form></section></div></main>
<dialog id="preview"><button id="closePreview">×</button><iframe title="遊戲預覽"></iframe></dialog><script src="../story-full.js"></script><script type="module" src="admin.js"></script></body></html>
